  }

  @keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-30px) scale(1.06)}}
  .blob{animation:floatBlob 9s ease-in-out infinite;filter:blur(60px)}
  .blob2{animation:floatBlob 11s ease-in-out infinite reverse;filter:blur(70px)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  .fade-up-1{animation-delay:.05s}.fade-up-2{animation-delay:.12s}.fade-up-3{animation-delay:.19s}.fade-up-4{animation-delay:.26s}

  @keyframes waveform{0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}}

<div id="root">
  <div id="fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:sans-serif;color:#8fb3ff;background:#060a17;">
    <div>Loading Interviewer…</div>
    <div style="font-size:12px;color:#5b6b8c;max-width:420px;text-align:center;">If this message doesn't go away after a few seconds, your browser or network is blocking a required script (React / Babel / Tailwind). Try opening this file directly in a normal browser tab instead of a preview pane, and check the browser console (F12) for the failing request.</div>
  </div>
</div>
<script>
  window.addEventListener('error', function(e){
    var root = document.getElementById('root');
    if (root && !root.dataset.mounted) {
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-family:monospace;color:#f0546b;background:#060a17;padding:24px;text-align:center;">' +
        '<div style="font-size:16px;">Something failed to load</div>' +
        '<div style="font-size:12px;color:#ccc;max-width:600px;">' + (e.message || 'Unknown error') + '</div>' +
        '<div style="font-size:11px;color:#5b6b8c;max-width:600px;">Source: ' + (e.filename || 'inline script') + (e.lineno ? (':' + e.lineno) : '') + '</div>' +
        '</div>';
    }
  });
  setTimeout(function(){
    var root = document.getElementById('root');
    if (root && !root.dataset.mounted) {
      var fb = document.getElementById('fallback');
      if (fb) fb.querySelector('div').textContent = 'Still loading… this is taking longer than expected.';
    }
  }, 4000);
</script>

  const base = "inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium transition-all duration-200 active:scale-[.97]";
  const variants = {
    primary: "btn-primary text-white",
    ghost: "btn-ghost text-slate-200 border border-white/15",
    subtle: "bg-white/5 hover:bg-white/10 text-slate-200 border border-white/10",
    danger: "bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-400/30",
  };
  return <button className={`${base} ${variants[variant]} ${className}`} {...rest}>{children}</button>;
};

const Input = ({label, className="", ...rest}) => (
  <label className="block">
    {label && <span className="text-xs font-medium text-slate-400 mb-1.5 block">{label}</span>}
    <input className={`w-full bg-white/5 border border-white/12 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder:text-slate-500 ring-input transition-all ${className}`} {...rest} />
  </label>
);

const ProgressRing = ({value, size=64, stroke=6, color="#5b8def"}) => {
  const r = (size - stroke) / 2, c = 2*Math.PI*r;
  const [off, setOff] = useState(c);
  useEffect(()=>{ const t = setTimeout(()=> setOff(c - (value/100)*c), 100); return ()=>clearTimeout(t); },[value]);
  return (
    <svg width={size} height={size} className="-rotate-90">
      <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,0.1)" strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={off} className="radar-ring"/>
    </svg>
  );
};

const MiniBar = ({data, color="#5b8def", h=64}) => {
  const max = Math.max(...data);
  return (
    <div className="flex items-end gap-1.5" style={{height:h}}>
      {data.map((v,i)=>(
        <div key={i} className="flex-1 rounded-t-md transition-all duration-700" style={{height:`${(v/max)*100}%`, background:`linear-gradient(180deg, ${color}, ${color}55)`, minHeight:4}}/>
      ))}
    </div>
  );
};

const LineSpark = ({data, color="#2fd48c", w=280, h=70}) => {
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((v-min)/(max-min||1))*h*0.85 - 6;
    return `${x},${y}`;
  }).join(" ");
  const areaPts = `0,${h} ${pts} ${w},${h}`;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" className="overflow-visible">
      <polygon points={areaPts} fill={color} opacity="0.12"/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
};

/* ======================= APP ======================= */
function App(){
  const [dark, setDark] = useState(true);
  const [page, setPage] = useState("landing");
  const [session, setSession] = useState(null);
  const [authOpen, setAuthOpen] = useState(null);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [activeJob, setActiveJob] = useState(JOBS[0]);
  const [toastMsg, setToastMsg] = useState(null);

  const toast = (m)=>{ setToastMsg(m); setTimeout(()=>setToastMsg(null), 2600); };

  const handleAuth = (role)=>{
    const presets = {
      company: {name:"Nimbus Cloud Systems", initials:"NC", color:"#5b8def", role:"company"},
      interviewer: {name:"Sana Fernandes", initials:"SF", color:"#2fd48c", role:"interviewer"},
      candidate: {name:"Ananya Rao", initials:"AR", color:"#f5a623", role:"candidate"},
    };
    setSession(presets[role]);
    setAuthOpen(null);
    setPage(`${role}-dashboard`);
  };

  useEffect(()=>{ document.documentElement.classList.toggle("light-mode", !dark); },[dark]);

  const renderPage = ()=>{
    switch(page){
      case "landing": return <Landing setAuthOpen={setAuthOpen}/>;
      case "company-dashboard": return <CompanyDashboard setPage={setPage}/>;
      case "interviewer-dashboard": return <InterviewerDashboard setPage={setPage}/>;
      case "candidate-dashboard": return <CandidateDashboard setPage={setPage}/>;
      case "admin-dashboard": return <AdminDashboard/>;
      case "admin-users": return <AdminUsers/>;
      case "jobs": return <JobsList setPage={setPage} setActiveJob={setActiveJob} session={session}/>;
      case "job-details": return <JobDetails job={activeJob} setPage={setPage} toast={toast}/>;
      case "candidates": return <CandidatesList setPage={setPage}/>;
      case "scheduling": return <Scheduling setPage={setPage} toast={toast}/>;
      case "video": return <VideoInterview setPage={setPage}/>;
      case "assessment": return <Assessment toast={toast}/>;
      case "payments": return <Payments session={session} toast={toast}/>;
      case "reports": return <Reports/>;
      default: return <Landing setAuthOpen={setAuthOpen}/>;
    }
  };

  return (
    <div onClick={()=>notifOpen && setNotifOpen(false)}>
      <TopNav page={page} setPage={setPage} dark={dark} setDark={setDark} session={session} setSession={setSession}
        setAuthOpen={setAuthOpen} notifOpen={notifOpen} setNotifOpen={setNotifOpen}/>
      <div className="flex">
        <Sidebar page={page} setPage={setPage} session={session} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
        <main className="flex-1 min-w-0">
          {session && (
            <button onClick={(e)=>{e.stopPropagation(); setMobileOpen(true);}} className="md:hidden fixed bottom-5 left-5 z-20 w-11 h-11 rounded-full btn-primary text-white flex items-center justify-center shadow-2xl">
              <Icon name="users" size={18}/>
            </button>
          )}
          {renderPage()}
        </main>
      </div>
      <AuthModal mode={authOpen} setMode={setAuthOpen} onAuth={handleAuth}/>
      <Toast toast={toastMsg}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
document.getElementById("root").dataset.mounted = "true";
</script>
</body>
</html>
